[project]
name = "jbsl-score-server"
version = "1.0.0"
requires-python = ">=3.12"
description = "Persistent JBSL Qualifier API and administration server"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
