<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランキング | JBSL Qualifier</title>
  <link rel="icon" href="/admin/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin/static/style.css">
  <script src="/admin/static/rankings.js" defer></script>
</head>
<body>
  <main class="public-rankings">
    <header>
      <div><span class="eyebrow">JBSL QUALIFIER</span><h1>ランキング</h1></div>
      <a href="/admin/">ログイン画面へ</a>
    </header>
    <section class="panel">
      <div class="toolbar ranking-filters">
        <label>リーグ<select id="ranking-league" aria-label="リーグ" disabled></select></label>
        <label>譜面<select id="ranking-map" aria-label="譜面" disabled><option value="">すべての譜面</option></select></label>
      </div>
      <p class="section-note">各ユーザーの有効な最高スコアを、譜面ごとに高い順で表示します。同点は同順位（1位・1位・3位）です。</p>
      <p class="muted">最新のランキングを確認するには、このページを再読み込みしてください。</p>
      <p class="muted">各行のDLからReplayをダウンロードできます。BeatLeader・ArcViewerは別タブで再生します。再生には対応する譜面・音源が必要です。</p>
      <p id="ranking-replay-note" class="muted" hidden>外部再生にはHTTPS配信の設定が必要です。現在はReplayをダウンロードして利用できます。</p>
      <p id="ranking-status" class="muted" role="status">ランキングを読み込んでいます…</p>
      <p id="ranking-error" class="error" role="alert" hidden></p>
    </section>
    <div id="ranking-list" aria-busy="true"></div>
    <noscript><p class="panel">ランキングの表示にはJavaScriptを有効にしてください。</p></noscript>
  </main>
</body>
</html>
